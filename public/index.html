<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>amharic-number-words — Amharic Number & Currency Converter</title>
  <meta name="description" content="Production-ready Amharic number-to-words converter for Ethiopian financial systems, banking, invoicing, receipts, and cheques.">
  <style>
    :root {
      --primary: #106b4e;
      --primary-hover: #0a4f38;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #f1f5f9;
      --success: #15803d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Nyala", "Abyssinica SIL", "Kefa", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 32px 16px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border);
    }

    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 1.25rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .preset-btn {
      background: var(--accent);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.825rem;
      cursor: pointer;
      font-family: inherit;
      color: var(--text);
      transition: background 0.15s;
    }

    .preset-btn:hover {
      background: #e2e8f0;
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      margin-bottom: 24px;
    }

    .mode-btn {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      color: var(--text-muted);
    }

    .mode-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      background: var(--accent);
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 24px;
      font-size: 0.85rem;
    }

    .options-grid select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      font-family: inherit;
    }

    .result-box {
      background: #f0fdf4;
      border: 2px solid #bbf7d0;
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }

    .result-box.error {
      background: #fef2f2;
      border-color: #fecaca;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .result-title {
      font-size: 0.825rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
    }

    .result-box.error .result-title {
      color: #dc2626;
    }

    .copy-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .copy-btn:hover {
      background: #f8fafc;
    }

    .result-text {
      font-size: 1.5rem;
      font-weight: 600;
      color: #064e3b;
      line-height: 1.4;
      word-break: break-word;
    }

    .result-box.error .result-text {
      font-size: 1.1rem;
      color: #b91c1c;
      font-weight: 500;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    
    footer a {
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>amharic-number-words</h1>
      <p class="subtitle">Convert any number into natural, grammatically correct Amharic words (ፊደል)</p>
    </header>

    <div class="form-group">
      <label for="numInput">ቁጥር ያስገቡ (Enter Amount or Number):</label>
      <input type="text" id="numInput" value="1500.50" placeholder="e.g. 1500.50, 2500000, -45" autocomplete="off" autofocus />
      
      <div class="presets">
        <span style="font-size: 0.8rem; color: var(--text-muted); align-self: center;">ምሳሌዎች (Presets):</span>
        <button class="preset-btn" data-val="0">0</button>
        <button class="preset-btn" data-val="15">15</button>
        <button class="preset-btn" data-val="100">100</button>
        <button class="preset-btn" data-val="101">101</button>
        <button class="preset-btn" data-val="1500.50">1,500.50</button>
        <button class="preset-btn" data-val="2500000">2,500,000</button>
        <button class="preset-btn" data-val="1000000000">1,000,000,000</button>
        <button class="preset-btn" data-val="-45.75">-45.75</button>
      </div>
    </div>

    <label>የአቀራረብ አይነት (Display Mode):</label>
    <div class="mode-tabs">
      <button class="mode-btn active" data-mode="currency">የኢትዮጵያ ብር (ETB)</button>
      <button class="mode-btn" data-mode="cheque">የባንክ ቼክ (Cheque)</button>
      <button class="mode-btn" data-mode="plain">ቁጥር ብቻ (Plain)</button>
      <button class="mode-btn" data-mode="receipt">የሽያጭ ደረሰኝ (Receipt)</button>
      <button class="mode-btn" data-mode="invoice">ጠቅላላ ድምር (Invoice)</button>
      <button class="mode-btn" data-mode="usd">ዶላር (USD)</button>
    </div>

    <div class="options-grid">
      <div>
        <label for="sostSelect">የቁጥር 3 አጻጻፍ:</label>
        <select id="sostSelect">
          <option value="ሦስት" selected>ሦስት (ባህላዊ / Formal)</option>
          <option value="ሶስት">ሶስት (ዘመናዊ / Modern)</option>
        </select>
      </div>

      <div>
        <label for="leadingHundred">የ 100 አጻጻፍ:</label>
        <select id="leadingHundred">
          <option value="true" selected>አንድ መቶ (Standard)</option>
          <option value="false">መቶ (Short)</option>
        </select>
      </div>

      <div>
        <label for="decimalMode">የነጥብ አቀራረብ:</label>
        <select id="decimalMode">
          <option value="digits" selected>አሃዝ በአሃዝ (Digits)</option>
          <option value="number">ሙሉ ቁጥር (Number)</option>
        </select>
      </div>
    </div>

    <div class="result-box" id="resultCard">
      <div class="result-header">
        <span class="result-title" id="resultLabel">በአማርኛ ፊደል (In Amharic Words)</span>
        <button class="copy-btn" id="copyBtn">ቅዳ (Copy)</button>
      </div>
      <div class="result-text" id="resultOutput">...</div>
    </div>

    <footer>
      Powered by <strong>amharic-number-words</strong> — Enterprise TypeScript Amharic Number Engine
    </footer>
  </div>

  <script type="module">
    import {
      numberToAmharicWords,
      currencyToAmharicWords,
      toChequeWords,
      formatAmountInAmharic,
      isSupportedNumber
    } from "./index.js";

    const numInput = document.getElementById("numInput");
    const resultOutput = document.getElementById("resultOutput");
    const resultCard = document.getElementById("resultCard");
    const copyBtn = document.getElementById("copyBtn");
    const sostSelect = document.getElementById("sostSelect");
    const leadingHundred = document.getElementById("leadingHundred");
    const decimalMode = document.getElementById("decimalMode");

    let currentMode = "currency";

    function update() {
      const val = numInput.value.trim();

      if (!val) {
        resultOutput.textContent = "እባክዎ ቁጥር ያስገቡ...";
        resultCard.classList.remove("error");
        return;
      }

      if (!isSupportedNumber(val)) {
        resultOutput.textContent = "የተሳሳተ የቁጥር ቅርጸት (Invalid number format)";
        resultCard.classList.add("error");
        return;
      }

      resultCard.classList.remove("error");

      const options = {
        sostSpelling: sostSelect.value,
        leadingOneHundred: leadingHundred.value === "true",
        decimalMode: decimalMode.value,
      };

      try {
        let text = "";
        switch (currentMode) {
          case "plain":
            text = numberToAmharicWords(val, options);
            break;
          case "currency":
            text = currencyToAmharicWords(val, { ...options, currency: "ETB" });
            break;
          case "cheque":
            text = toChequeWords(val, { ...options, currency: "ETB" });
            break;
          case "receipt":
            text = formatAmountInAmharic(val, { ...options, currency: "ETB", style: "receipt" });
            break;
          case "invoice":
            text = formatAmountInAmharic(val, { ...options, currency: "ETB", style: "invoice" });
            break;
          case "usd":
            text = currencyToAmharicWords(val, { ...options, currency: "USD" });
            break;
        }
        resultOutput.textContent = text;
      } catch (err) {
        resultOutput.textContent = err.message || "Error converting number";
        resultCard.classList.add("error");
      }
    }

    numInput.addEventListener("input", update);
    sostSelect.addEventListener("change", update);
    leadingHundred.addEventListener("change", update);
    decimalMode.addEventListener("change", update);

    document.querySelectorAll(".mode-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
        update();
      });
    });

    document.querySelectorAll(".preset-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        numInput.value = btn.dataset.val;
        update();
      });
    });

    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(resultOutput.textContent).then(() => {
        copyBtn.textContent = "ተቀድቷል! (Copied!)";
        setTimeout(() => {
          copyBtn.textContent = "ቅዳ (Copy)";
        }, 1500);
      });
    });

    // Initial render
    update();
  </script>
</body>
</html>
